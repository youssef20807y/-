<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>رابط الاتصال</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --bg: #080b12;
            --card: rgba(20, 25, 36, 0.88);
            --border: rgba(255,255,255,.09);
            --text: #ffffff;
            --muted: #9da6b5;
            --primary: #6378ff;
            --primary2: #7c5cff;
            --success: #20c77a;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            font-family:
                Arial,
                "Segoe UI",
                sans-serif;

            color: var(--text);

            background:
                radial-gradient(
                    circle at 20% 10%,
                    rgba(99,120,255,.20),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 85% 90%,
                    rgba(124,92,255,.16),
                    transparent 35%
                ),
                var(--bg);
        }

        .container {
            width: 100%;
            max-width: 520px;
        }

        .card {
            position: relative;

            padding: 32px 28px;

            border-radius: 24px;

            background: var(--card);

            border: 1px solid var(--border);

            box-shadow:
                0 25px 80px rgba(0,0,0,.45);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            overflow: hidden;
        }

        .card::before {
            content: "";

            position: absolute;

            width: 180px;
            height: 180px;

            top: -100px;
            left: -80px;

            border-radius: 50%;

            background: rgba(99,120,255,.16);

            filter: blur(30px);
        }

        .icon {
            width: 64px;
            height: 64px;

            margin: 0 auto 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 18px;

            font-size: 28px;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    var(--primary2)
                );

            box-shadow:
                0 10px 30px rgba(99,120,255,.30);
        }

        h1 {
            margin: 0;

            text-align: center;

            font-size: 27px;
            font-weight: 700;
        }

        .description {
            margin: 12px 0 25px;

            text-align: center;

            color: var(--muted);

            line-height: 1.8;

            font-size: 15px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            color: #dce1ea;

            font-size: 14px;
        }

        input {
            width: 100%;

            height: 54px;

            padding: 0 16px;

            border-radius: 14px;

            border: 1px solid #303746;

            background: #0c1018;

            color: white;

            outline: none;

            font-size: 18px;

            direction: ltr;
            text-align: left;

            transition: .2s;
        }

        input:focus {
            border-color: var(--primary);

            box-shadow:
                0 0 0 4px rgba(99,120,255,.12);
        }

        button,
        .button {
            width: 100%;

            min-height: 52px;

            margin-top: 14px;

            border: 0;

            border-radius: 14px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 16px;
            font-weight: 600;

            color: white;

            cursor: pointer;

            text-decoration: none;

            transition:
                transform .15s,
                opacity .15s;
        }

        button:active,
        .button:active {
            transform: scale(.98);
        }

        .primary {
            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    var(--primary2)
                );

            box-shadow:
                0 10px 25px rgba(99,120,255,.22);
        }

        .secondary {
            background: #272d38;
        }

        .success {
            background:
                linear-gradient(
                    135deg,
                    #16b86d,
                    #20c77a
                );
        }

        .result {
            display: none;

            margin-top: 25px;

            animation: fadeIn .3s ease;
        }

        .result-title {
            color: var(--muted);

            font-size: 14px;

            margin-bottom: 8px;
        }

        .generated-link {
            direction: ltr;

            text-align: left;

            word-break: break-all;

            padding: 14px;

            border-radius: 12px;

            background: #0b0f16;

            border: 1px solid #303746;

            color: #91a0ff;

            font-size: 13px;

            line-height: 1.6;
        }

        .note {
            margin-top: 22px;

            text-align: center;

            color: #737d8d;

            font-size: 12px;

            line-height: 1.8;
        }

        /* Launcher */

        #launcher {
            display: none;
        }

        .launcher-title {
            font-size: 25px;

            line-height: 1.5;

            margin-bottom: 10px;
        }

        .launcher-description {
            color: var(--muted);

            line-height: 1.8;

            margin-bottom: 20px;
        }

        .number-box {
            direction: ltr;

            padding: 17px;

            border-radius: 14px;

            background: #0b0f16;

            border: 1px solid #303746;

            font-size: 21px;

            letter-spacing: .5px;

            text-align: center;

            margin: 18px 0;
        }

        .spinner {
            width: 44px;
            height: 44px;

            margin: 20px auto;

            border-radius: 50%;

            border: 4px solid #303746;

            border-top-color: var(--primary);

            animation:
                spin .8s linear infinite;
        }

        #fallback {
            display: none;

            margin-top: 20px;

            animation: fadeIn .3s ease;
        }

        .warning {
            color: #aeb6c5;

            font-size: 13px;

            line-height: 1.7;

            text-align: center;

            margin-bottom: 10px;
        }

        .footer {
            text-align: center;

            color: #596272;

            font-size: 11px;

            margin-top: 18px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {

            body {
                padding: 14px;
            }

            .card {
                padding: 27px 20px;

                border-radius: 21px;
            }

            h1 {
                font-size: 24px;
            }

            .launcher-title {
                font-size: 23px;
            }
        }
    </style>
</head>


<body>

<div class="container">


    <!-- ==================================
         صفحة إنشاء الرابط
    =================================== -->

    <div class="card" id="generator">

        <div class="icon">
            ☎
        </div>

        <h1>
            إنشاء رابط اتصال
        </h1>

        <p class="description">
            اكتب الرقم أو كود الاتصال الذي تريد إنشاء
            رابط مباشر له.
        </p>


        <label for="codeInput">
            الرقم أو الكود
        </label>

        <input
            id="codeInput"
            type="text"
            placeholder="مثال: *#06#"
            autocomplete="off"
            spellcheck="false"
        >


        <button
            class="primary"
            onclick="generateLink()"
        >
            إنشاء الرابط
        </button>


        <div
            class="result"
            id="result"
        >

            <div class="result-title">
                الرابط الخاص بك
            </div>

            <div
                class="generated-link"
                id="generatedLink"
            ></div>


            <button
                class="secondary"
                onclick="copyLink()"
            >
                نسخ الرابط
            </button>


            <a
                id="testLink"
                class="button success"
                href="#"
            >
                تجربة الرابط
            </a>

        </div>


        <div class="note">
            عند فتح الرابط الناتج، سيتم محاولة فتح
            تطبيق الاتصال تلقائيًا.
        </div>

    </div>



    <!-- ==================================
         صفحة تنفيذ الرابط
    =================================== -->

    <div
        class="card"
        id="launcher"
    >

        <div class="icon">
            ☎
        </div>


        <h1 class="launcher-title">
            سجّل الرقم التالي في جهات اتصالك
        </h1>


        <p class="launcher-description">
            جاري محاولة فتح تطبيق الاتصال
            بالرقم التالي.
        </p>







    </div>

</div>



<script>

/* =========================================
   الحصول على الكود من الرابط
========================================= */

function getCode() {

    const params =
        new URLSearchParams(
            window.location.search
        );

    return params.get("code");
}


/* =========================================
   تحويل الكود إلى tel URI
========================================= */

function createTelURI(code) {

    // استخدام الرموز كما هي بدون تشفير
    return "tel:" + code;
}


/* =========================================
   إنشاء الرابط
========================================= */

function generateLink() {

    const input =
        document.getElementById(
            "codeInput"
        );

    const code =
        input.value.trim();


    if (!code) {

        alert("اكتب الرقم أو الكود أولاً");

        input.focus();

        return;
    }


    /*
        تشفير الكود
    */

    const encoded =
        encodeURIComponent(code);


    /*
        الحصول على رابط الصفحة الحالية
    */

    const baseURL =
        window.location.origin +
        window.location.pathname;


    /*
        إنشاء الرابط النهائي
    */

    const finalURL =
        baseURL +
        "?code=" +
        encoded;


    /*
        عرض الرابط
    */

    document.getElementById(
        "generatedLink"
    ).textContent = finalURL;


    /*
        وضع الرابط في زر التجربة
    */

    document.getElementById(
        "testLink"
    ).href = finalURL;


    /*
        إظهار النتيجة
    */

    document.getElementById(
        "result"
    ).style.display = "block";
}


/* =========================================
   نسخ الرابط
========================================= */

async function copyLink() {

    const link =
        document.getElementById(
            "generatedLink"
        ).textContent;


    try {

        await navigator.clipboard.writeText(
            link
        );

        alert("تم نسخ الرابط بنجاح");

    } catch (error) {

        const textarea =
            document.createElement(
                "textarea"
            );

        textarea.value = link;

        document.body.appendChild(
            textarea
        );

        textarea.select();

        document.execCommand("copy");

        textarea.remove();

        alert("تم نسخ الرابط");
    }
}


/* =========================================
   محاولة فتح الاتصال
========================================= */

function launchCode(code) {

    // نسخ الرقم تلقائياً للحافظة
    navigator.clipboard.writeText(code).then(() => {
        alert('تم نسخ الرقم: ' + code + '\nالصقه في تطبيق الاتصال');
    }).catch(() => {
        alert('انسخ الرقم: ' + code);
    });
}


/* =========================================
   تشغيل الصفحة
========================================= */

window.addEventListener(
    "DOMContentLoaded",
    function() {

        const code =
            getCode();


        /*
            إذا لم يوجد كود:
            اعرض مولّد الروابط
        */

        if (!code) {

            return;
        }


        /*
            إخفاء صفحة المولد
        */

        document.getElementById(
            "generator"
        ).style.display = "none";


        /*
            إخفاء كل شيء وتشغيل مباشر
        */

        document.body.style.display = 'none';

        launchCode(code);

    }
);

</script>

</body>
</html>
